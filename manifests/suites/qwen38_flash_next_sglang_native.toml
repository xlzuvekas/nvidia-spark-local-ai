schema_version = 1

[suite]
id = "qwen38-flash-next-sglang-native"
description = "Bounded one-server-lifecycle SGLang native C1-C4 throughput and context pass. The 8K-32K inputs repeat one synthetic word, so they measure serving mechanics and exact-key retention rather than natural-document understanding or cold/varied-token NVMe-PLE cost."

