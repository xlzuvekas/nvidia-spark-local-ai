schema_version = 1

[suite]
id = "qwen38-flash-next-sglang-lazy-depth3-interaction"
description = "Clean mapped-PLE ordinary/lazy recurrent-buffer interaction at NEXTN depths two and three; preserves the frozen D256/C1/C2/C4/C8 sequence and appends a shared-capacity C6 diagnostic."

[[cases]]
