# Keep C6 after the original five cases so their prompts and preceding case
# order remain identical to the first lazy-D3 lifetime. With 32 recurrent
# states, offered C6 is state-capacity-feasible for ordinary extra_buffer
# (five slots/request) and lazy extra_buffer (four slots/request).
