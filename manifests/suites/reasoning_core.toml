schema_version = 1

[suite]
id = "reasoning-core"
description = "Core matrix for low-effort reasoning profiles; prefill and needle cases reserve completion budget for reasoning before the visible answer."

# Decode and concurrency budgets intentionally match core.toml so their request
# shapes remain comparable. Reasoning tokens count toward those same budgets.
[[cases]]
id = "decode-256"
kind = "decode"
requires = ["chat"]
warmups = 2
repetitions = 5
max_output_tokens = 256
temperature = 0.0
concurrency = 1
prompt_repetitions = 0

[[cases]]
id = "decode-1024"
kind = "decode"
requires = ["chat"]
warmups = 2
repetitions = 5
max_output_tokens = 1024
temperature = 0.0
concurrency = 1
prompt_repetitions = 0

# Prefill throughput remains prompt tokens divided by TTFT to the first visible
# content or reasoning delta; the remaining budget only lets the request finish.
[[cases]]
id = "prefill-repeat-128"
kind = "prefill"
requires = ["chat"]
warmups = 1
repetitions = 5
max_output_tokens = 64
temperature = 0.0
concurrency = 1
prompt_repetitions = 128

