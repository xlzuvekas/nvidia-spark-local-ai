id = "graphiti-reuse-fact"
kind = "memory"
requires = ["chat", "json"]
warmups = 0
repetitions = 3
max_output_tokens = 1536
max_turns = 1
temperature = 0.0
concurrency = 1
prompt_repetitions = 0

