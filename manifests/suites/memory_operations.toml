schema_version = 1

[suite]
id = "memory-operations"
description = "Graphiti-style edge resolution followed by explicitly synthetic MemFS/transaction extension cases; exact JSON grading and scalar-only results."
protocol_digest = "sha256:96df2d5d742c6f4863c77ec3c6cc980845d43900e25607d37fe0be361f0808f1"

# Graphiti-inspired two-array resolver family. These cases grade only edge
# reuse, contradiction invalidation plus new-fact acceptance, and unrelated
# new-fact acceptance. They do not claim to
# exercise a live Graphiti store or Graphiti's own extraction prompts.
