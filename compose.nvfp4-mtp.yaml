services:
  qwen38:
    command:
      - Inferact/Qwen3.8-27B-NVFP4
      - --served-model-name
      - Qwen/Qwen3.8-27B
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "65536"
      - --gpu-memory-utilization
      - "0.52"
      - --kv-cache-dtype
      - fp8
      - --max-num-seqs
      - "1"
      - --max-num-batched-tokens
      - "${MAX_BATCHED_TOKENS:-4096}"
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":${MTP_TOKENS:-3}}'
