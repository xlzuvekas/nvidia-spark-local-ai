services:
  qwen38:
    image: vllm/vllm-openai:qwen38
    container_name: qwen38-27b
    restart: unless-stopped
    ipc: host
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/huggingface:/root/.cache/huggingface
      - ./data/vllm:/root/.cache/vllm
    environment:
      HF_HOME: /root/.cache/huggingface
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ulimits:
      memlock: -1
      stack: 67108864
    command:
      - Qwen/Qwen3.8-27B
      - --served-model-name
      - Qwen/Qwen3.8-27B
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "65536"
      - --gpu-memory-utilization
      - "0.52"
      - --kv-cache-dtype
      - fp8
      - --max-num-seqs
      - "1"
      - --max-num-batched-tokens
      - "4096"
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
